name: Build and deploy JAR app to Azure Web App - api-participa-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'back/participaapp/pom.xml'

      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: back/participaapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: back/participaapp/target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_ADE63FCD219E4764BBC80DDAFA13EBF0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9FF0F986318F4402B460A716CCB02159 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_32482FB920EE44999903D88320C3EA71 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-participa-backend-dmf5edfjhudjbucb'
          package: '*.jar'
