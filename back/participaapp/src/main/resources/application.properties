spring.application.name=participaapp

# ============================================================================
# CONEXION AZURE SQL DATABASE / MICROSOFT SQL SERVER
# Lee variables de entorno si están presentes en la nube o usa valores por defecto
# ============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://sqlserver-participa.database.windows.net:1433;databaseName=participa_db;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:adminparticipa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Participa2026!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Dialecto Hibernate para Azure SQL / SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Manejo de esquema (ddl-auto=none preserva la estructura de base de datos creada en Azure)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor web
server.port=${PORT:8080}

# Codificación UTF-8 para manejo de tildes y caracteres especiales
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Configuración de carga de archivos (máximo 5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB